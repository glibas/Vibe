# Vibe Configuration File
# Vision transformer for Interface Beauty Evaluation

experiment:
  name: "vibe_saliency_guided"
  description: "Saliency-guided Vision Transformer for interface beauty evaluation"
  seed: 42
  device: "cuda"
  output_dir: "./outputs"
  log_dir: "./logs"
  checkpoint_dir: "./checkpoints"
  log_level: "INFO"
  log_interval: 100
  eval_metrics:
    - "mse"
    - "mae" 
    - "rmse"
    - "pearson"
    - "spearman"

model:
  model_type: "saliency_guided"  # basic, saliency_guided, roi_enhanced
  img_size: 224
  patch_size: 16
  embed_dim: 768
  n_layers: 12
  n_heads: 12
  mlp_ratio: 4.0
  dropout: 0.1
  n_classes: 1
  use_beauty_tokens: true
  saliency_weight: 0.5
  roi_scales:
    - 32
    - 64
    - 128
  roi_fusion_method: "attention"  # concat, attention, weighted

training:
  num_epochs: 100
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.01
  optimizer: "adamw"  # adamw, adam, sgd
  scheduler: "cosine"  # step, cosine, plateau, none
  warmup_epochs: 5
  eval_interval: 5
  save_interval: 10
  gradient_clip: 1.0
  
  # Loss weights
  beauty_weight: 1.0
  aspect_weight: 0.5
  principle_weight: 0.3
  consistency_weight: 0.2

data:
  train_data_path: "./data/train"
  train_annotations: "./data/train_annotations.csv"
  val_data_path: "./data/val"
  val_annotations: "./data/val_annotations.csv"
  test_data_path: "./data/test"
  test_annotations: "./data/test_annotations.csv"
  
  img_size: 224
  num_workers: 4
  pin_memory: true
  augmentation: true
  
  # Dataset splits (if creating from single dataset)
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1